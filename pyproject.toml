[build-system]
requires = ["setuptools>=77.0.3", "wheel", "pybind11>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyna-chaos"
version = "0.10.0"
description = "Python library for dynamical systems and magnetic confinement fusion analysis"
readme = "README.md"
license = "LGPL-3.0-or-later"
authors = [{name = "Wenyin Wei", email = "wenyin.wei.ww@gmail.com"}]
requires-python = ">=3.9"
keywords = ["dynamical systems", "chaos", "plasma physics", "MHD", "Poincaré map", "magnetic confinement"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "sympy>=1.10",
    "deprecated>=1.2",
    "h5py>=3.0",
    "joblib>=1.2",
    "plotly>=5.20",
    "eval-type-backport; python_version < '3.10'",
]

license-files = ["LICENSE"]

[project.optional-dependencies]
cuda = ["cupy-cuda12x"]
dev = ["pytest", "jupyter", "notebook", "tqdm"]
jax = ["jax"]
prefect = ["prefect>=3.0"]
progress = ["tqdm>=4.60"]
workflow = ["prefect>=3.0"]
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme",
    "myst-parser",
    "nbsphinx",
    "sphinx-autodoc-typehints",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-autoapi",
    "ipykernel",
    "scikit-image",
    "deprecated",
    "pandas",
    "pytest-timeout",
    "nbmake",
    "kaleido>=0.2,<1",
]

[project.urls]
Homepage = "https://github.com/WenyinWei/pyna"
Repository = "https://github.com/WenyinWei/pyna"
Issues = "https://github.com/WenyinWei/pyna/issues"

[tool.setuptools.packages.find]
include = ["pyna*", "cyna*"]
exclude = ["notebooks*"]

# Include compiled extension binaries in the wheel.
# Without this, setuptools only packs .py files and the .pyd/.so would be missing.
[tool.setuptools.package-data]
"pyna._cyna" = ["*.pyd", "*.so", "*.so.*"]

# Build selectors and installed-wheel checks shared by release CI and local
# cibuildwheel runs. setup.py declares the compiled extension for wheel tagging.
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["*-win32", "*-musllinux*", "*-manylinux_i686"]
environment = { CYNA_WITH_CUDA = "0", CYNA_SKIP_TOOL_INSTALL = "1" }
test-command = "python {project}/tests/wheel_smoke.py"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"
inherit.environment = "append"
# Resolve build/test dependencies using wheels compatible with each glibc image.
environment = { PATH = "/root/.local/bin:$PATH", PIP_ONLY_BINARY = ":all:" }

[tool.cibuildwheel.macos]
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

# CPython 3.14 is unavailable in manylinux2014; retain the older baseline for
# 3.9–3.13 rather than unnecessarily raising their glibc requirement.
[[tool.cibuildwheel.overrides]]
select = "cp314-*"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.pytest.ini_options]
testpaths = ["tests"]
