name: Build and Publish Wheels

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Publish to PyPI and GitHub Release (select a version tag)"
        type: choice
        options: ["no", "yes"]
        default: "no"

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      publish: ${{ steps.source.outputs.publish }}
      tag: ${{ steps.source.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve the source commit and validate release version
        id: source
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.upload == 'yes' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib

          publish = os.environ["PUBLISH"] == "true"
          tag = os.environ["REF_NAME"] if os.environ["REF_TYPE"] == "tag" else ""
          if publish:
              with open("pyproject.toml", "rb") as stream:
                  version = tomllib.load(stream)["project"]["version"]
              if tag != f"v{version}":
                  raise SystemExit(f"Publishing requires version tag v{version}; got {tag or 'a branch'}")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"sha={sha}\npublish={str(publish).lower()}\ntag={tag}\n")
          PY

  build_wheels:
    name: Wheels / ${{ matrix.os }} / ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-2022
            arch: AMD64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # Linux builds run inside manylinux containers, so no host xmake is needed.
      - name: Install xmake (macOS / Windows host)
        if: runner.os != 'Linux'
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "3.0.8"

      # Build selectors, environments and installed-wheel tests live in pyproject.toml.
      # Every architecture runs natively, including each wheel's test-command.
      - name: Build, repair and test wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_ALL_LINUX: |
            set -eu
            for compiler in gcc g++ c++; do
              if [ ! -x "/usr/bin/$compiler" ] && command -v "$compiler" >/dev/null 2>&1; then
                ln -s "$(command -v "$compiler")" "/usr/bin/$compiler"
              fi
            done
            curl -fsSL https://github.com/xmake-io/xmake/releases/download/v3.0.8/xmake-v3.0.8.gz.run -o /tmp/xmake.run
            sh /tmp/xmake.run --noexec --quiet --target /tmp/xmake-src
            (cd /tmp/xmake-src && ./configure)
            make -C /tmp/xmake-src --no-print-directory -j4
            make -C /tmp/xmake-src --no-print-directory install PREFIX="$HOME/.local"
            XMAKE_ROOT=y "$HOME/.local/bin/xmake" --version

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    name: sdist
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      # Building the source distribution does not invoke build_ext.
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  upload_pypi:
    name: Publish to PyPI
    needs: [prepare, build_wheels, build_sdist]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/pyna-chaos
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  upload_release:
    name: Attach distributions to GitHub Release
    needs: [prepare, upload_pypi]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
